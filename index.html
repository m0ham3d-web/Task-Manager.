<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #0f172a, #111827, #312e81); color: #fff; }
      .wrap { max-width: 1200px; margin: 0 auto; padding: 18px; }
      h1 { margin: 0 0 6px; font-size: 32px; }
      p { color: #dbe4ff; }
      .panel { background: rgba(15, 23, 42, 0.78); border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 18px; padding: 14px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.35); backdrop-filter: blur(10px); }
      .topbar { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
      input { flex: 1 1 260px; border: 1px solid #6366f1; border-radius: 10px; background: #111827; color: #fff; padding: 10px 12px; }
      button { border-radius: 10px; border: 1px solid #8b5cf6; background: linear-gradient(135deg, #8b5cf6, #3b82f6); color: #fff; font-weight: 700; padding: 10px 14px; cursor: pointer; }
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
      .stat-card { background: linear-gradient(135deg, #ffffff, #eef2ff); color: #111827; border: 1px solid #ddd6fe; border-radius: 16px; padding: 14px; box-shadow: 0 10px 25px rgba(124, 58, 237, 0.12); font-weight: 700; }
      .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
      .column { background: linear-gradient(180deg, #ffffff, #f8fafc); color: #111827; border: 1px solid #e2e8f0; border-radius: 18px; padding: 14px; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.10); }
      .task { background: linear-gradient(135deg, #ffffff, #eef2ff); border: 1px solid #c7d2fe; border-radius: 14px; padding: 12px; margin-bottom: 10px; box-shadow: 0 8px 18px rgba(79, 70, 229, 0.08); }
      .tag { color: #6366f1; text-transform: uppercase; letter-spacing: 1.2px; font-size: 12px; margin: 0 0 4px; }
      .task h3 { margin: 0 0 8px; font-size: 16px; }
      .muted { color: #475569; font-size: 12px; margin: 0 0 8px; }
      .actions { display: flex; gap: 8px; }
      .actions button { background: #fff; color: #4338ca; border: 1px solid #c4b5fd; font-weight: 700; padding: 7px 10px; }
      .actions button:disabled { opacity: 0.45; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Task Manager</h1>
      
      <div class="panel">
        <div class="topbar">
          <input id="taskInput" type="text" placeholder="Add a new task..." />
          <button id="addBtn" type="button">Add Task</button>
        </div>

        <div class="stats">
          <article class="stat-card">Total Tasks: <span id="totalCount">0</span></article>
          <article class="stat-card">Backlog: <span id="backlogCount">0</span></article>
          <article class="stat-card">In Progress: <span id="progressCount">0</span></article>
          <article class="stat-card">Done: <span id="doneCount">0</span></article>
        </div>

        <div class="board" id="board"></div>
      </div>
    </div>

    <script>
      const columns = [
        { key: 'backlog', label: 'Backlog' },
        { key: 'progress', label: 'In Progress' },
        { key: 'done', label: 'Done' },
      ]

      const starterTasks = [
        { id: 1, title: 'Design onboarding flow', status: 'backlog', tag: 'Design', due: 'Today' },
        { id: 2, title: 'Prepare sprint summary', status: 'progress', tag: 'Ops', due: 'Tomorrow' },
        { id: 3, title: 'Ship landing page updates', status: 'done', tag: 'Front-end', due: 'Done' },
      ]

      let tasks = [...starterTasks]
      const input = document.getElementById('taskInput')
      const board = document.getElementById('board')

      function render() {
        const summary = {
          total: tasks.length,
          backlog: tasks.filter((t) => t.status === 'backlog').length,
          progress: tasks.filter((t) => t.status === 'progress').length,
          done: tasks.filter((t) => t.status === 'done').length,
        }

        document.getElementById('totalCount').textContent = summary.total
        document.getElementById('backlogCount').textContent = summary.backlog
        document.getElementById('progressCount').textContent = summary.progress
        document.getElementById('doneCount').textContent = summary.done

        board.innerHTML = columns.map((column) => {
          const items = tasks.filter((task) => task.status === column.key)
          return `
            <section class="column">
              <h2 style="margin: 0 0 12px; font-size: 18px;">${column.label}</h2>
              ${items.map((task) => `
                <article class="task">
                  <p class="tag">${task.tag}</p>
                  <h3>${task.title}</h3>
                  <p class="muted">Due: ${task.due}</p>
                  <div class="actions">
                    <button type="button" ${column.key === 'backlog' ? 'disabled' : ''} onclick="moveTask(${task.id}, -1)">Back</button>
                    <button type="button" ${column.key === 'done' ? 'disabled' : ''} onclick="moveTask(${task.id}, 1)">Next</button>
                  </div>
                </article>
              `).join('')}
              ${items.length === 0 ? '<p style="color:#64748b;">No tasks here yet.</p>' : ''}
            </section>
          `
        }).join('')
      }

      function moveTask(taskId, direction) {
        tasks = tasks.map((task) => {
          if (task.id !== taskId) return task
          const currentIndex = columns.findIndex((column) => column.key === task.status)
          const nextIndex = Math.min(columns.length - 1, Math.max(0, currentIndex + direction))
          return { ...task, status: columns[nextIndex].key }
        })
        render()
      }

      function addTask() {
        const value = input.value.trim()
        if (!value) return
        tasks = [{ id: Date.now(), title: value, status: 'backlog', tag: 'New', due: 'Now' }, ...tasks]
        input.value = ''
        render()
      }

      document.getElementById('addBtn').addEventListener('click', addTask)
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') addTask()
      })

      render()
    </script>
  </body>
</html>
